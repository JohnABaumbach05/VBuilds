<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>VBuilds</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <img src="/images/VBuildsLogo.png"
         alt="VBuilds"
         class="vbuilds-banner">
</header>

<div class="page-layout">

    <aside>
        <a href="#" class="sidebar-link">
            <img src="/images/ViewBuildLogo.png"
                 alt="View Builds">
        </a>

        <a href="#" class="sidebar-link">
            <img src="/images/CreateBuildLogo2.png"
                 alt="Create Build">
        </a>

        <a href="#" class="sidebar-link">
            <img src="/images/ImagineBuildLogo.png"
                 alt="Imagine Build">
        </a>

        <a href="#" class="sidebar-link">
            <img src="/images/BrowseByCategoryLogo.png"
                 alt="Browse By Category">
        </a>

        <a href="#" class="sidebar-link">
            <img src="/images/LoginLogo.png"
                 alt="Login">
        </a>

        <a href="#" class="sidebar-link">
            <img src="/images/AccountLogo.png"
                 alt="Account">
        </a>
    </aside>


    <main>

        <!-- FEATURED BUILDS -->
        <section class="featured-builds">

            <img src="/images/FeaturedBuildsLogo.png"
                 alt="Featured Builds"
                 class="section-header">

            <div class = "featured-build-grid" id="featured-builds"></div>
        </section>
        {

        <!-- HIGHEST HORSEPOWER -->
        <section class="highest-horsepower-builds">

            <img src="/images/HighestHorsepowerBuildsLogo.png"
                 alt="Highest Horsepower Builds"
                 class="section-header">

            <div class="highest-horsepower-grid" id="highest-horsepower"></div>
        </section>

        }
        <!-- RANDOM BUILDS -->
        <section class="random-builds">

            <img src="/images/RandomBuildsLogo.png"
                 alt="Random Builds"
                 class="section-header">

            <div class="random-build-grid" id="random-builds"></div>
        </section>


        <!-- NEW BUILDS -->
        <section class="new-builds">

            <img src="/images/NewBuildsLogo.png"
                 alt="New Builds"
                 class="section-header">

            <div class="new-builds-Grid">

                <a href="#">
                    <img class="build-image"
                         src="/images/HTMLPNG.png"
                         alt="New build">
                </a>

            </div>
        </section>

    </main>

</div>

<script src="/js/app.js"></script>

</body>
</html>
