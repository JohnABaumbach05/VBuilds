<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>VBuilds</title>
    <link rel="stylesheet" href="/CSS/Global.css">
    <link rel="stylesheet" href="/CSS/frontPage.css">
</head>

<body>

<div id="navigation"></div>

<div class="page-layout">

    <main>

        <!-- FEATURED BUILDS -->
        <section class="featured-builds">

            <img src="/webImages/FeaturedBuildsLogo.png"
                 alt="Featured Builds"
                 class="section-header">

            <div class="featured-build-grid"
                 id="featured-builds"></div>

        </section>


        <!-- HIGHEST HORSEPOWER -->
        <section class="highest-horsepower-builds">

            <img src="/webImages/HighestHorsepowerBuildsLogo.png"
                 alt="Highest Horsepower Builds"
                 class="section-header">

            <div class="highest-horsepower-grid"
                 id="highest-horsepower"></div>

        </section>


        <!-- RANDOM BUILDS -->
        <section class="random-builds">

            <img src="/webImages/RandomBuildsLogo.png"
                 alt="Random Builds"
                 class="section-header">

            <div class="random-build-grid"
                 id="random-builds"></div>

        </section>


        <!-- NEW BUILDS -->
        <section class="new-builds">

            <img src="/webImages/NewBuildsLogo.png"
                 alt="New Builds"
                 class="section-header">

            <div class="new-builds-grid"
                 id="new-builds"></div>

        </section>

    </main>

</div>

<script src="/javascript/global.js"></script>
<script src="/javascript/frontPage.js"></script>

</body>
</html>
