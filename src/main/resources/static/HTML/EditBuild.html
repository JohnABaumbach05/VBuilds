
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Build | VBuilds</title>

  <link rel="stylesheet" href="/CSS/Global.css">
  <link rel="stylesheet" href="/CSS/CreateBuild.css">
</head>

<body>

<div id="navigation"></div>

<main class="create-build-container">

  <div class="create-build-content">

    <h1>Edit Your Build</h1>

    <form id="create-build-form">

      <input
              type="text"
              id="buildTitle"
              placeholder="Build Title"
              required
      >

      <input
              type="number"
              id="year"
              placeholder="Year"
              min="1900"
              max="2100"
              required
      >




      <select id="trim" name="trim" required>
        <option value="" disabled selected>Select a trim</option>
        <option value="Base">Base</option>
        <option value="Premium">Premium</option>
        <option value="Limited">Limited</option>
        <option value="GT">GT</option>
      </select>



      <input
              type="number"
              id="horsepower"
              placeholder="Wheel Horsepower"
              min="0"
      >

      <input
              type="text"
              id="tuner"
              placeholder="Tuner"
      >

      <input
              type="number"
              id="buildCost"
              placeholder="Price of Total Parts"
              min="0"
              step="1"
      >

      <textarea
              id="caption"
              placeholder="Describe your build..."
              rows="4"
      ></textarea>

      <div class="build-ratings">

        <h2>Rate Your Build</h2>

        <div class="rating-group">
          <label for="happiness">Happiness</label>

          <div class="rating-slider">
            <input
                    type="range"
                    id="happiness"
                    min="1"
                    max="10"
                    value="5"
            >
            <span id="happinessValue">5</span>
          </div>
        </div>

        <div class="rating-group">
          <label for="reliability">Reliability</label>

          <div class="rating-slider">
            <input
                    type="range"
                    id="reliability"
                    min="1"
                    max="10"
                    value="5"
            >
            <span id="reliabilityValue">5</span>
          </div>
        </div>

        <div class="rating-group">
          <label for="loudness">Loudness</label>

          <div class="rating-slider">
            <input
                    type="range"
                    id="loudness"
                    min="1"
                    max="10"
                    value="5"
            >
            <span id="loudnessValue">5</span>
          </div>
        </div>

      </div>

      <section class="parts-editor" aria-labelledby="photo-editor-title">
        <h2 id="photo-editor-title">BUILD PHOTOS</h2>
        <p class="parts-help">Keep your current photos, replace the main photo, or add more gallery photos.</p>
        <div id="existingPhotoList" class="edit-photo-grid"></div>
        <label for="editMainPhoto">Change Main Build Photo (optional)</label>
        <input id="editMainPhoto" type="file" accept="image/jpeg,image/png,image/webp">
        <label for="editAdditionalPhotos">Add Gallery Photos</label>
        <input id="editAdditionalPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        <button id="savePhotosButton" type="button">Upload Selected Photos</button>
        <p id="photoStatus" role="status"></p>
      </section>

      <section class="parts-editor" aria-labelledby="parts-editor-title">
        <h2 id="parts-editor-title">ADD PARTS</h2>
        <p class="parts-help">Add modifications to your build. Each added part appears in its own box.</p>
        <div class="part-entry-box">
          <label for="partCategory">Part Category</label>
          <select id="partCategory">
            <option value="" selected disabled>Select a category</option>
            <option value="Intake">Intake</option>
            <option value="Exhaust">Exhaust</option>
            <option value="Intercooler & Charge Pipes">Intercooler &amp; Charge Pipes</option>
            <option value="Turbo & Boost">Turbo &amp; Boost</option>
            <option value="Fuel System">Fuel System</option>
            <option value="Engine">Engine</option>
            <option value="ECU & Tuning">ECU &amp; Tuning</option>
            <option value="Transmission & Drivetrain">Transmission &amp; Drivetrain</option>
            <option value="Suspension">Suspension</option>
            <option value="Brakes">Brakes</option>
            <option value="Wheels & Tires">Wheels &amp; Tires</option>
            <option value="Exterior">Exterior</option>
            <option value="Interior">Interior</option>
            <option value="Electronics">Electronics</option>
            <option value="__custom__">Other / Custom Part</option>
          </select>
          <div id="customCategoryWrap" hidden>
            <label for="customCategory">Custom Category</label>
            <input id="customCategory" type="text" maxlength="60" placeholder="Enter your category">
          </div>
          <label for="partManufacturer">Manufacturer</label>
          <input id="partManufacturer" type="text" maxlength="100" placeholder="Manufacturer">
          <label for="partName">Part Name</label>
          <input id="partName" type="text" maxlength="150" placeholder="Part name">
          <label for="partCost">Part Cost ($)</label>
          <input id="partCost" type="number" min="0" step="1" placeholder="Price paid">
          <label for="partDescription">Description</label>
          <textarea id="partDescription" maxlength="1000" placeholder="Details about this part"></textarea>
          <label for="partReliability">Part Reliability (0–10)</label>
          <input id="partReliability" type="number" min="0" max="10" value="5">
          <label for="partPower">Estimated Power Added (HP)</label>
          <input id="partPower" type="number" min="0" value="0">
          <label class="part-checkbox"><input id="partLouder" type="checkbox"> Makes the car louder</label>
          <label for="partLink">Part Link (Optional)</label>
          <input id="partLink" type="url" maxlength="200" pattern="[hH][tT][tT][pP][sS]?://.+" placeholder="https://example.com/part" title="Enter a full HTTP or HTTPS URL">
          <button id="addPartButton" type="button">Add Part</button>
        </div>
        <div id="addedPartsList" class="added-parts-list" aria-live="polite"></div>
      </section>

      <button type="submit">Save Build Changes</button>
      <p id="editStatus" role="status"></p>

    </form>

  </div>

</main>

<script src="/javascript/Global.js"></script>
<script src="/javascript/auth.js"></script>
<script src="/javascript/EditBuild.js"></script>

</body>
</html>
