<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="/CSS/Global.css">
    <link rel="stylesheet" href="/CSS/LoginSidebar.css">
</head>

<body>

<div id="navigation"></div>

<main>
    <section class="Login-button" id="open-login">
        <img src = "/webImages/LoginPage/LoginforLoginPage.png"
             alt="Login">
    </section>

    <section class="Account-button" id="open-account">
        <img src = "/webImages/LoginPage/CreateAccount.png"
             alt="Account">
    </section>

    <section id="logged-in-user" style="display: none;">

        <p class="login-label">Logged in as:</p>

        <h2 id="display-username"></h2>

        <div class="account-actions">
            <a href="/HTML/Account.html" id="view-account-button">
                Account
            </a>

            <button id="logout-button" type="button">
                Logout
            </button>
        </div>

    </section>
</main>

<div class="modal" id="account-modal">

    <div class = "modal-content">

        <span class="close" id="close-account">&times;</span>


        <form id="account-form">
        <input
            type="text"
            id="account-username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            id="account-email"
            placeholder="Email"
            required
        >
            <input
                type="password"
                id="account-password"
                placeholder="Password"
                required
            >

        <button type="submit">Create Account</button>
        </form>
    </div>
</div>

<div class="modal" id="login-modal">

    <div class = "modal-content">

        <span class="close" id="close-login">&times;</span>


        <form id="login-form">
            <input
                    type="text"
                    id="login-username"
                    placeholder="Username"
                    required
            >

            <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required
            >

            <button type="submit">Login</button>
        </form>
    </div>
</div>

<script src="/javascript/Global.js"></script>
<script src="/javascript/LoginSidebar.js"></script>
<script src="/javascript/auth.js" defer></script>

</body>
</html>
