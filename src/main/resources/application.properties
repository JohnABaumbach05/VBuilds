spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# Same-origin CSRF allowlist; set to your exact HTTPS site URL in production.
vbuilds.public-origin=${VBUILDS_PUBLIC_ORIGIN:http://localhost:8080}

# Browser session defaults. HTTPS deployments MUST set VBUILDS_COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${VBUILDS_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
