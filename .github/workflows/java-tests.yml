name: VBuilds Java Tests

on:
  push:
    branches:
      - main
      - feature/build-parts-management
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vbuilds_test
          POSTGRES_USER: vbuilds_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vbuilds_test -d vbuilds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/vbuilds_test
      DB_USER: vbuilds_test
      PASSWORD: test_only_password
      VBUILDS_DB_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit and PostgreSQL integration tests
        run: mvn --batch-mode --no-transfer-progress test
