name: Java tests

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vbuilds_test
          POSTGRES_USER: vbuilds_test
          POSTGRES_PASSWORD: vbuilds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vbuilds_test -d vbuilds_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/vbuilds_test
      DB_USER: vbuilds_test
      PASSWORD: vbuilds_test
      VBUILDS_DB_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unit and PostgreSQL integration tests
        run: mvn --batch-mode --no-transfer-progress test
