name: VBuilds Java Tests

on:
  push:
    branches:
      - main
      - feature/build-parts-management
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress test
